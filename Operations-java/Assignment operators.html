<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment operators</title>
</head>
<body>
    <script>
        let salary=10000;
        console.log("current salary:" + salary);
        salary += 2000;
        console.log("Bonus salary:" + salary);

        let billamt=299;
        console.log("current bill amount:" + billamt);
        billamt -= 99;
        console.log("discounted bill amount:" + billamt);

        let level=2,score=2500;
        console.log("current level:" + level);
        console.log("current score:" + score);
        level++;
        score *=2;
        console.log("new level:" + level);
        console.log("new score:" + score);

        let totalmark=1600;
        totalmark /= 4;
        console.log("mark divided for 4 students is:" + totalmark);

        let currentBalance=10000;
        console.log("current balance is:" + currentBalance);
        currentBalance -= 2000;
        console.log("current balance after withdrawl is:" + currentBalance);

        let price=200;
        let newprice = price * 1.10;
        console.log("current price is:" + price);
        console.log("price after increment is:" + newprice);

        let productsInStock=100;
        console.log ("products in stock before sale is:" + productsInStock);
        productsInStock -= 10;
        console.log("products in stock after sale is:" + productsInStock);

        let expense1 =50;
        let expence2=50;
        let expence3=50;
        let totalexpence=expense1+expence2+expence3;
        console.log("Total daily expences:" + totalexpence);

        let a=5;
        console.log("before squaring:" +a);
         a **= 2;
        console.log("number after squaring:",a); 

        let num=59;
        console.log("current number is:" + num);
        num %=7;
        console.log("Reminder is:" + num);
    </script>
</body>
</html>
