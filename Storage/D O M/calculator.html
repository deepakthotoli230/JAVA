<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Using DOM</title>

    <style>
        *{
            justify-content: center;
            align-items: center;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 40px;
            background-color: rgb(161, 85, 85);
            justify-content: center;
            align-items: center;
        }

        .head {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 15px cornsilk;
        }

        .head h1 {
            text-align: center;
            font-weight: bold;
            color: brown;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            
            color: white;
            background-color: black;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 20px;
        }

        #result {
            font-size: 35px;
            font-weight: bold;
            width: 500px;
            height: 100px;
            margin: 20px auto;
            background-color: white;
            color: rgb(16, 24, 136);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="head">

        <h1>CALCULATOR USING DOM</h1>

        <input type="number" id="num1" placeholder="Enter the first Number">

        <input type="number" id="num2" placeholder="Enter the second Number">

        <button id="add">ADD</button>
        <button id="sub">SUBTRACT</button>
        <button id="mul">MULTIPLY</button>
        <button id="div">DIVIDE</button>

    </div>

    <div id="result">
        Result:
    </div>


    <script>

        const num1 = document.getElementById("num1");
        const num2 = document.getElementById("num2");

        const add = document.getElementById("add");
        const sub = document.getElementById("sub");
        const mul = document.getElementById("mul");
        const div = document.getElementById("div");

        const result = document.getElementById("result");


        // ADDITION
        add.addEventListener("click", function() {

            let a = Number(num1.value);
            let b = Number(num2.value);

            result.innerHTML = "Result: " + (a + b);

        });


        // SUBTRACTION
        sub.addEventListener("click", function() {

            let a = Number(num1.value);
            let b = Number(num2.value);

            result.innerHTML = "Result: " + (a - b);

        });


        // MULTIPLICATION
        mul.addEventListener("click", function() {

            let a = Number(num1.value);
            let b = Number(num2.value);

            result.innerHTML = "Result: " + (a * b);

        });


        // DIVISION
        div.addEventListener("click", function() {

            let a = Number(num1.value);
            let b = Number(num2.value);

            if (b == 0) {

                result.innerHTML = "Cannot divide by Zero";

            }
            else {

                result.innerHTML = "Result: " + (a / b);

            }

        });

    </script>

</body>

</html>
